    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        .action-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-card:active { transform: scale(0.95); }

        .nav-tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #1d4ed8;
            font-weight: 700;
        }

        #modal-overlay { transition: opacity 0.3s ease; }
        #modal-container { transition: transform 0.3s ease, opacity 0.3s ease; }

        .poeps-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .poeps-table th, .poeps-table td { border: 1px solid #e2e8f0; padding: 12px 10px; text-align: left; vertical-align: middle; }
        .poeps-table th { background: #f8fafc; font-weight: 800; text-transform: uppercase; color: #475569; font-size: 0.65rem; letter-spacing: 0.025em; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chart-container { position: relative; height: 300px; width: 100%; }
        @media (max-width: 640px) {
            .chart-container { height: 250px; }
        }

        .badge-meta { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; }
        .badge-meta-done { background-color: #dcfce7; color: #166534; }
        .badge-meta-alert { background-color: #fee2e2; color: #991b1b; }
        
        .indicator-mini-card { transition: all 0.2s ease; border: 1px solid #e2e8f0; }
        .indicator-mini-card:hover { border-color: #3b82f6; background-color: #f0f7ff; transform: translateY(-2px); }
        .indicator-mini-card.active { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .authorship-card {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
            background-color: white;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .authorship-card {
                bottom: 1rem;
                right: 1rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

        function handleLogin() {
            const muniId = document.getElementById('setup-muni').value;
            const pass = document.getElementById('setup-pass').value;
            if (MUNI_CONFIG[muniId] && pass === MUNI_CONFIG[muniId].pass) {
                currentMuniId = muniId;
                document.getElementById('setup-flow').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('display-muni-name').innerText = MUNI_CONFIG[muniId].name;
                setTeamType('esf_eap');
            } else { 
                document.getElementById('login-error').classList.remove('hidden'); 
            }
        }

        function setTeamType(type) {
            currentTeamType = type;
            document.querySelectorAll('nav button').forEach(b => { 
                b.classList.remove('nav-tab-active'); 
                b.classList.add('text-slate-500'); 
            });
            const activeTab = document.getElementById(`tab-${type.replace('esf_eap', 'esf')}`);
            if(activeTab) { 
                activeTab.classList.add('nav-tab-active'); 
                activeTab.classList.remove('text-slate-500'); 
            }
            renderTeamList();
            renderActionButtons();
        }

        function renderTeamList() {
            const list = document.getElementById('team-list');
            list.innerHTML = '';
            const teams = Object.keys(ALL_TEAMS_DATA).filter(id => ALL_TEAMS_DATA[id].muni === currentMuniId && ALL_TEAMS_DATA[id].type === currentTeamType);
            
            if (teams.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 p-4">Nenhuma equipe cadastrada.</p>`;
                return;
            }

            teams.forEach(id => {
                const btn = document.createElement('button');
                btn.onclick = () => selectTeam(id);
                btn.id = `side-${id}`;
                btn.className = "flex-none md:flex-shrink-0 md:w-full text-left px-4 py-3 rounded-xl text-xs font-semibold transition-all whitespace-nowrap md:whitespace-normal mb-1 border md:border-0 border-slate-100 text-slate-600 bg-white";
                btn.innerText = ALL_TEAMS_DATA[id].name;
                list.appendChild(btn);
            });
            
            if (teams.length > 0) selectTeam(teams[0]);
        }

        function selectTeam(id) {
            document.querySelectorAll('#team-list button').forEach(b => { 
                b.className = "flex-none md:flex-shrink-0 md:w-full text-left px-4 py-3 rounded-xl text-xs font-semibold transition-all whitespace-nowrap md:whitespace-normal mb-1 border md:border-0 border-slate-100 text-slate-600 bg-white"; 
            });
            const activeBtn = document.getElementById(`side-${id}`);
            if (activeBtn) activeBtn.className = "flex-none md:flex-shrink-0 md:w-full text-left px-4 py-3 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-md mb-1 whitespace-nowrap md:whitespace-normal";
            
            currentTeamId = id;
            if(ALL_TEAMS_DATA[id]) {
                document.getElementById('main-title').innerText = ALL_TEAMS_DATA[id].name;
            }
        }

            if (!currentTeamId || !ALL_TEAMS_DATA[currentTeamId]) return;

            const grid = document.getElementById('actions-grid');
            const commonActions = [{ id: 'indicadores', icon: '📊', title: 'Indicadores de Qualidade', color: 'border-blue-200 hover:bg-blue-50' }];
            const esfActions = [
                { id: 'vinculo', icon: '🔗', title: 'Vínculo e Acompanhamento', color: 'border-indigo-200 hover:bg-indigo-50' },

                { id: 'poeps-quad', icon: '📆', title: 'POEPS - Avaliação do Quadrimestre', color: 'border-purple-200 hover:bg-purple-50' },
                { id: 'pse', icon: '🏫', title: 'PSE - Planejamento Mensal', color: 'border-teal-200 hover:bg-teal-50' },

            grid.innerHTML = allActions.map(act => `

        function calculateScore(code, teamId) {
            const data = ALL_TEAMS_DATA[teamId].indicators[code];
            if (!data) return 0;
            if (code === 'C1' || code.startsWith('B') || code === 'M2') return (data.num / data.den) * 100;
            if (code === 'M1') return (data.num / data.den);
            if (code === 'C7') {
                if (data.num !== undefined && data.den !== undefined) return (data.num / data.den) * 100;
                return ((data.prev.num / data.prev.den) * 20) + ((data.vax.num / data.vax.den) * 30) + ((data.cons.num / (data.cons.den || 1000)) * 30) + ((data.mamo.num / data.mamo.den) * 20);
            }
            return (data.num / data.den);
        }

        function getClassification(score, code) {
            const azul = "#2563eb"; const verde = "#16a34a"; const amarelo = "#ca8a04"; const vermelho = "#dc2626";
            
            // --- ATUALIZAÇÃO SOLICITADA PARA OS INDICADORES C2, C3, C4, C5, C6 e C7 ---
            if (['C2', 'C3', 'C4', 'C5', 'C6', 'C7'].includes(code)) {
                if (score > 75) return { label: "Ótimo", color: "text-blue-600", hex: azul, bg: "bg-blue-50", border: "border-blue-200" };
                if (score > 50) return { label: "Bom", color: "text-green-600", hex: verde, bg: "bg-green-50", border: "border-green-200" };
                if (score > 25) return { label: "Suficiente", color: "text-yellow-600", hex: amarelo, bg: "bg-yellow-50", border: "border-yellow-200" };
                return { label: "Regular", color: "text-red-600", hex: vermelho, bg: "bg-red-50", border: "border-red-200" };
            }

            // Regra específica para M1 (Média de Atendimentos)
            if (code === 'M1') {
                if (score > 3) return { label: "Ótimo", color: "text-blue-600", hex: azul, bg: "bg-blue-50", border: "border-blue-200" };
                if (score > 2) return { label: "Bom", color: "text-green-600", hex: verde, bg: "bg-green-50", border: "border-green-200" };
                if (score > 1) return { label: "Suficiente", color: "text-yellow-600", hex: amarelo, bg: "bg-yellow-50", border: "border-yellow-200" };
                return { label: "Regular", color: "text-red-600", hex: vermelho, bg: "bg-red-50", border: "border-red-200" };
            }

            if (code === 'C1') {
                if (score > 50 && score <= 70) return { label: "Ótimo", color: "text-blue-600", hex: azul, bg: "bg-blue-50", border: "border-blue-200" };
                if (score > 30 && score <= 50) return { label: "Bom", color: "text-green-600", hex: verde, bg: "bg-green-50", border: "border-green-200" };
                if (score > 10 && score <= 30) return { label: "Suficiente", color: "text-yellow-600", hex: amarelo, bg: "bg-yellow-50", border: "border-yellow-200" };
                return { label: "Regular", color: "text-red-600", hex: vermelho, bg: "bg-red-50", border: "border-red-200" };
            }
            
            // M2 e B6 continuam com a regra anterior
            if (code === 'M2' || code === 'B6') {
                 if (score >= 5.90) return { label: "Ótimo", color: "text-blue-600", hex: azul, bg: "bg-blue-50", border: "border-blue-200" };
                 if (score >= 4.0) return { label: "Bom", color: "text-green-600", hex: verde, bg: "bg-green-50", border: "border-green-200" };
            }

            if (score > 80) return { label: "Ótimo", color: "text-blue-600", hex: azul, bg: "bg-blue-50", border: "border-blue-200" };
            if (score > 50) return { label: "Bom", color: "text-green-600", hex: verde, bg: "bg-green-50", border: "border-green-200" };
            if (score > 20) return { label: "Suficiente", color: "text-yellow-600", hex: amarelo, bg: "bg-yellow-50", border: "border-yellow-200" };
            return { label: "Regular", color: "text-red-600", hex: vermelho, bg: "bg-red-50", border: "border-red-200" };
        }

        function openModal(module) {
            document.getElementById('modal-overlay').classList.remove('pointer-events-none', 'opacity-0');
            document.getElementById('modal-container').classList.remove('scale-95', 'opacity-0');
            if (module === 'indicadores') renderIndicadores();
            else if (module === 'vinculo') renderVinculo();
            else if (module === 'poeps-plan') renderPoepsPlan();
            else if (module === 'poeps-eval') renderPoepsEval();
            else if (module === 'poeps-quad') renderPoepsQuad();
            else if (module === 'pse') renderPSE();
            else if (module === 'pse-acomp') renderPSEAcomp();
            else if (module === 'edu-examples') renderEduExamples(); // NOVO
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-container').classList.add('scale-95', 'opacity-0');
            if (barChartInstance) barChartInstance.destroy();
        }

                                <th class="w-1/3">ESCOLA PACTUADA</th>
                                <th>AÇÃO</th>
                                <th>AÇÕES DO PSE CORRESPONDENTES</th>
                                <th>REGISTRO</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function renderPSEAcomp() {
            // ALTERAÇÃO: Agora busca TODAS as escolas do município, independente da equipe selecionada
            const muniDB = PSE_DETALHADO_DB[currentMuniId] || {};
            const schools = Object.keys(muniDB);

            document.getElementById('modal-title').innerText = "PSE - Acompanhamento";
            document.getElementById('modal-subtitle').innerText = `${MUNI_CONFIG[currentMuniId].name} (Visão Geral do Município)`;

            if (schools.length === 0) {
                document.getElementById('modal-body').innerHTML = `<div class="p-6 text-center text-slate-400 italic">Nenhuma escola cadastrada para monitoramento neste município.</div>`;
                return;
            }

            // Função auxiliar para definir o estilo se o valor for "0"
            const getCellStyle = (val) => val === "0" ? "bg-red-100 text-red-600 font-extrabold border-red-200" : "text-slate-600";

            const rows = schools.map(schoolName => {
                // Como estamos iterando sobre as chaves do próprio DB, os dados existem.
                const schoolData = muniDB[schoolName] || { 
                    inep: "---", a03: "---", a09: "---", a12: "---", a13: "---", a14: "---" 
                };

                return `
                <tr>
                    <td class="!text-center text-slate-500 font-mono text-[10px] font-bold">${schoolData.inep}</td>
                    <td class="font-bold text-slate-700 text-xs min-w-[150px]">${schoolName}</td>
                    <td class="!text-center font-bold text-xs ${getCellStyle(schoolData.a03)}">${schoolData.a03}</td>
                    <td class="!text-center font-bold text-xs ${getCellStyle(schoolData.a09)}">${schoolData.a09}</td>
                    <td class="!text-center font-bold text-xs ${getCellStyle(schoolData.a12)}">${schoolData.a12}</td>
                    <td class="!text-center font-bold text-xs ${getCellStyle(schoolData.a13)}">${schoolData.a13}</td>
                    <td class="!text-center font-bold text-xs ${getCellStyle(schoolData.a14)}">${schoolData.a14}</td>
                </tr>`;
            }).join('');

            document.getElementById('modal-body').innerHTML = `
                <div class="mb-6 p-4 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center gap-3">
                    <span class="text-2xl">📢</span>
                    <div>
                        <h4 class="text-sm font-black text-indigo-900 uppercase tracking-wide">Ações Prioritárias Ciclo 2025/2026</h4>
                        <p class="text-xs text-indigo-700 font-medium">Células em <span class="text-red-600 font-bold bg-red-100 px-1 rounded">vermelho</span> indicam ausência de registro para a ação monitorada.</p>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden overflow-x-auto no-scrollbar">
                    <div class="p-4 bg-cyan-600 text-white flex items-center gap-2">
                        <span class="text-lg">📈</span>
                        <span class="text-xs font-black tracking-widest uppercase">Tabela de Monitoramento por Escola (Todas as Escolas)</span>
                    </div>
                    <table class="poeps-table min-w-[900px]">
                        <thead>
                            <tr>
                                <th class="w-16 !text-center">INEP</th>
                                <th class="min-w-[150px] !text-center">ESCOLA</th>
                                <th class="!text-center w-24">03<br>Alimentação Saudável</th>
                                <th class="!text-center w-24">09<br>Prev. Violência / Cultura Paz</th>
                                <th class="!text-center w-24">12<br>Situação Vacinal</th>
                                <th class="!text-center w-24">13<br>Saúde Mental</th>
                                <th class="!text-center w-24">14<br>Saúde Sexual e Reprodutiva</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div class="mt-2 text-right">
                    <span class="text-[10px] text-slate-400 font-bold italic">* Dados de Janeiro à Outubro de 2025.</span>
                </div>
            `;
        }
        
        window.onload = () => {
            const passInput = document.getElementById('setup-pass');
            if(passInput) {
                passInput.focus();
                passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
            }
        };
    </script>
</body>


</html>
